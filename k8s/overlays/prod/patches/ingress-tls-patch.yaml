# Production TLS patch for Ingress
# Replace 'airesume.yourdomain.com' with your actual production domain.
# Requires cert-manager with a ClusterIssuer named 'letsencrypt-prod' for automatic TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airesume-ingress
  namespace: airesume
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - airesume.yourdomain.com
      secretName: airesume-tls-secret
  rules:
    - host: airesume.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
