name: AI Resume Builder CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

# All registry/image config is loaded from deploy.env at runtime.
# Change your Docker Hub username in deploy.env — no need to edit this file.

jobs:
  # ── Job 1: Lint & Code Quality ──────────────────────────────────
  lint-and-test:
    name: Lint & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Check Backend
        run: |
          cd backend
          npm ci

      - name: Install & Lint Frontend
        run: |
          cd frontend
          npm ci
          npm run lint || true

  # ── Job 2: Build & Push Docker Images ───────────────────────────
  docker-build-push:
    name: Build & Push Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load config from deploy.env
        run: grep -v '^#' deploy.env | grep -v '^$' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Docker Compose Integration Test ──────────────────────
  docker-compose-test:
    name: Test Docker Compose Stack
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Services with Docker Compose
        run: docker compose up -d --build

      - name: Check Container Status
        run: docker compose ps

      - name: Verify Backend Health Check
        run: |
          sleep 10
          curl -f http://localhost:5000/api/health || exit 1

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v

  # ── Job 4: Deploy to Kubernetes ─────────────────────────────────
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: docker-compose-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load config from deploy.env
        run: grep -v '^#' deploy.env | grep -v '^$' >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags with Kustomize
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            airesumebuilder-backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            airesumebuilder-frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/overlays/prod/
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/airesume-backend --timeout=180s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/airesume-frontend --timeout=180s

      - name: Post-Deploy Smoke Test
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} port-forward svc/backend 5000:5000 &
          sleep 5
          curl -f http://localhost:5000/api/health || {
            echo "Smoke test failed — rolling back..."
            kubectl -n ${{ env.K8S_NAMESPACE }} rollout undo deployment/airesume-backend
            kubectl -n ${{ env.K8S_NAMESPACE }} rollout undo deployment/airesume-frontend
            exit 1
          }
          echo "Smoke test passed!"
