name: AI Resume Builder CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Check Backend
        run: |
          cd backend
          npm ci

      - name: Install & Lint Frontend
        run: |
          cd frontend
          npm ci
          npm run lint || true

  docker-build:
    name: Build & Validate Docker Containers
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: airesumebuilder-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: airesumebuilder-frontend:test

  docker-compose-test:
    name: Test Docker Compose Stack
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Services with Docker Compose
        run: docker compose up -d --build

      - name: Check Container Status
        run: docker compose ps

      - name: Verify Backend Health Check
        run: |
          sleep 10
          curl -f http://localhost:5000/api/health || exit 1

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
