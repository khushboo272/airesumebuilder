services:
  mongodb:
    image: mongo:7-jammy
    container_name: airesume-mongodb-dev
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: airesumebuilder
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - airesume-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airesume-backend-dev
    command: npm run dev
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/airesumebuilder
      - NODE_ENV=development
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
    networks:
      - airesume-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airesume-frontend-dev
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend
    networks:
      - airesume-dev-network

networks:
  airesume-dev-network:
    driver: bridge

volumes:
  mongo-dev-data:
    driver: local
